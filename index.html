    let currentFontLimit = 30;

    function convertText(text, map) {
      if(!map) return text;
      return text.split('').map(c => map[c] || c).join('');
    }

    function generateFonts() {
      const raw = document.getElementById('font-input').value.trim() || 'Royal King';
      const container = document.getElementById('fonts-grid');
      container.innerHTML = '';
      let allFonts = [];

      UNICODE_FONTS.forEach(f => {
        const converted = convertText(raw, f.map);
        allFonts.push({ title: f.name, text: converted });
        DECORATION_STYLES.forEach(d => {
          allFonts.push({ title: `${f.name} + ${d.prefix.slice(0,4)}`, text: `${d.prefix}${converted}${d.suffix}` });
        });
      });

      const sliced = allFonts.slice(0, currentFontLimit);
      sliced.forEach(item => {
        const card = document.createElement('div');
        card.className = "p-2.5 bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-between gap-2 hover:border-slate-700 transition";
        card.innerHTML = `
          <div class="overflow-hidden">
            <p class="text-[9px] uppercase font-bold text-slate-500">${item.title}</p>
            <p class="text-sm text-slate-100 font-medium truncate select-all">${item.text}</p>
          </div>
          <button onclick="copyText('${escapeJs(item.text)}')" class="shrink-0 bg-slate-800 hover:bg-pink-600 text-slate-200 hover:text-white text-xs px-3 py-1.5 rounded-lg font-semibold transition">
            <i class="fa-regular fa-copy"></i>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function loadMoreFonts() {
      currentFontLimit += 35;
      generateFonts();
    }

    const SHYAM_FONT_STYLES = [
      { name: "Bold", text: "𝐉𝐚𝐢 𝐒𝐡𝐫𝐞𝐞 𝐒𝐡𝐲𝐚𝐦" },
      { name: "Italic", text: "𝐽𝑎𝑖 𝑆𝑕𝑟𝑒𝑒 𝑆𝑕𝑦𝑎𝑚" },
      { name: "Bold Italic", text: "𝑱𝒂𝒊 𝑺𝒉𝒓𝒆𝒆 𝑺𝒉𝒚𝒂𝒎" },
      { name: "Sans", text: "𝖩𝖺𝗂 𝖲𝗁𝗋𝖾𝖾 𝖲𝗁𝗒𝖺𝗆" },
      { name: "Sans Bold", text: "𝗝𝗮𝗶 𝗦𝗵𝗿𝒆𝗲 𝗦𝗵𝘆𝗮𝗺" },
      { name: "Sans Italic", text: "𝘑𝘢𝘪 𝘚𝘩𝘳𝘦𝘦 𝘚𝘩𝘺𝘢𝘮" },
      { name: "Sans Bold Italic", text: "𝙅𝙖𝙞 𝙎𝙝𝙧𝙚𝙚 𝙎𝙝𝙮𝙖𝙢" },
      { name: "Monospace", text: "𝙹𝚊𝚒 𝚂𝚑𝚛𝚎𝚎 𝚂𝚑𝚢𝚊𝚖" },
      { name: "Script", text: "𝒥𝒶𝒾 𝒮𝒽𝓇𝒺𝒺 𝒮𝒽𝓎𝒶𝓂" },
      { name: "Bold Script", text: "𝓙𝓪𝓲 𝓢𝓱𝓻𝓮𝓮 𝓢𝓱𝔂𝓪𝓶" },
      { name: "Fraktur", text: "𝔍𝔞𝔦 𝔖𝔥𝔯𝔢𝔢 𝔖𝔥𝔶𝔞𝔪" },
      { name: "Bold Fraktur", text: "𝕵𝖆𝖎 𝕾𝖍𝖗𝖊𝖊 𝕾𝖍𝖞𝖆𝖒" }
    ];

    const SHYAM_FRAMES = [
      { p: "꧁༺ ", s: " ༻꧂" }, { p: "꧁༺", s: "༻꧂" }, { p: "꧁༺ • ", s: " • ༻꧂" }, { p: "꧁༺ ✦ ", s: " ✦ ༻꧂" }, { p: "꧁༺ ", s: " ࿐" }, { p: "࿐ ", s: " ༻꧂" },
      { p: "♛ ", s: " ♛" }, { p: "♛", s: "♛" }, { p: "♛ • ", s: " • ♛" }, { p: "♛ ✦ ", s: " ✦ ♛" }, { p: "♛ ", s: " ࿐" }, { p: "࿐ ", s: " ♛" },
      { p: "『VIP』 ", s: " ࿐" }, { p: "『VIP』", s: "࿐" }, { p: "『VIP』 • ", s: " • ࿐" }, { p: "『VIP』 ✦ ", s: " ✦ ࿐" }, { p: "࿐ ", s: " ࿐" },
      { p: "彡 ", s: " 彡" }, { p: "彡", s: "彡" }, { p: "彡 • ", s: " • 彡" }, { p: "彡 ✦ ", s: " ✦ 彡" }, { p: "彡 ", s: " ࿐" }, { p: "࿐ ", s: " 彡" },
      { p: "༒ ", s: " ༒" }, { p: "༒", s: "༒" }, { p: "༒ • ", s: " • ༒" }, { p: "༒ ✦ ", s: " ✦ ༒" }, { p: "༒ ", s: " ࿐" }, { p: "࿐ ", s: " ༒" },
      { p: "⚜ ", s: " ⚜" }, { p: "⚜", s: "⚜" }, { p: "⚜ • ", s: " • ⚜" }, { p: "⚜ ✦ ", s: " ✦ ⚜" }, { p: "⚜ ", s: " ࿐" }, { p: "࿐ ", s: " ⚜" },
      { p: "𓆩 ", s: " 𓆪" }, { p: "𓆩", s: "𓆪" }, { p: "𓆩 • ", s: " • 𓆪" }, { p: "𓆩 ✦ ", s: " ✦ 𓆪" }, { p: "𓆩 ", s: " ࿐" }, { p: "࿐ ", s: " 𓆪" },
      { p: "♔ ", s: " ♔" }, { p: "♔ • ", s: " • ♔" }, { p: "♔ ✦ ", s: " ✦ ♔" }, { p: "★彡 ", s: " 彡★" }, { p: "◥ ", s: " ◤" }, { p: "乂 ", s: " 乂" }, { p: "么 ", s: " 么" },
      { p: "【♛】 ", s: " 【♛】" }, { p: "♕ ", s: " ♕" }, { p: "༺ ", s: " ༻" }, { p: "👑✨ ", s: " ✨👑" }, { p: "💙 ", s: " 💙" }, { p: "🔱 ", s: " 🔱" },
      { p: "🦚 ", s: " 🦚" }, { p: "🙏🌸 ", s: " 🌸🙏" }, { p: "🚩 ", s: " 🚩" }, { p: "🌺 ", s: " 🌺" }, { p: "💫 ", s: " 💫" }, { p: "🙏 ", s: " 🙏" },
      { p: "🪷 ", s: " 🪷" }, { p: "🌼 ", s: " 🌼" }, { p: "✨ ", s: " ✨" }, { p: "☬ ", s: " ☬" }, { p: "❖ ", s: " ❖" }, { p: "♕༒ ", s: " ༒♕" }
    ];

    let activeShyamFilter = 'all';
    let shyamLimit = 35;

    function renderShyamDesigns() {
      const search = (document.getElementById('shyam-search').value || '').toLowerCase().trim();
      const container = document.getElementById('shyam-container');
      container.innerHTML = '';

      let list = [];
      let counter = 1;

      SHYAM_FONT_STYLES.forEach(font => {
        if (activeShyamFilter === 'all' || font.name === activeShyamFilter) {
          SHYAM_FRAMES.forEach(frame => {
            const formatted = `${frame.p}${font.text}${frame.s}`;
            if (!search || formatted.toLowerCase().includes(search) || font.name.toLowerCase().includes(search)) {
              list.push({
                id: String(counter).padStart(4, '0'),
                font: font.name,
                design: formatted
              });
            }
            counter++;
          });
        }
      });

      const sliced = list.slice(0, shyamLimit);

      if (sliced.length === 0) {
        container.innerHTML = `<div class="p-4 bg-slate-900 border border-slate-800 rounded-xl text-center text-xs text-slate-400">कोई डिज़ाइन नहीं मिला। कीवर्ड बदलकर देखें!</div>`;
        return;
      }

      sliced.forEach(item => {
        const div = document.createElement('div');
        div.className = "p-2.5 bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-between gap-2 hover:border-amber-500/50 transition";
        div.innerHTML = `
          <div class="overflow-hidden">
            <div class="flex items-center gap-2 mb-0.5">
              <span class="text-[9px] font-bold text-amber-400">[${item.font}]</span>
              <span class="text-[9px] text-slate-500 font-mono">#${item.id}</span>
            </div>
            <p class="text-sm text-slate-100 font-medium truncate select-all">${item.design}</p>
          </div>
          <button onclick="copyText('${escapeJs(item.design)}')" class="shrink-0 bg-slate-800 hover:bg-amber-600 text-slate-200 hover:text-white text-xs px-3 py-1.5 rounded-lg font-semibold transition">
            <i class="fa-regular fa-copy"></i>
          </button>
        `;
        container.appendChild(div);
      });
    }

    function filterShyam(cat) {
      activeShyamFilter = cat;
      shyamLimit = 35;
      document.querySelectorAll('.shyam-cat-btn').forEach(b => {
        if(b.getAttribute('onclick').includes(`'${cat}'`)) {
          b.className = "shyam-cat-btn whitespace-nowrap px-3.5 py-1.5 rounded-xl bg-amber-600 text-white font-semibold shadow-md";
        } else {
          b.className = "shyam-cat-btn whitespace-nowrap px-3.5 py-1.5 rounded-xl bg-slate-800 text-slate-300 font-semibold";
        }
      });
      renderShyamDesigns();
    }

    function loadMoreShyam() {
      shyamLimit += 40;
      renderShyamDesigns();
    }

    // --- TAB SWITCHER ---
    function switchTab(tabId) {
      ['fonts', 'bio', 'captions', 'hashtags', 'shyam'].forEach(id => {
        const sec = document.getElementById(`section-${id}`);
        const btn = document.getElementById(`tab-btn-${id}`);
        if(id === tabId) {
          sec.classList.remove('hidden');
          btn.className = "py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 transition bg-gradient-to-r from-pink-600 to-rose-600 text-white shadow-md";
        } else {
          sec.classList.add('hidden');
          btn.className = "py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 transition text-slate-400 hover:text-white";
        }
      });
      if(tabId === 'shyam') renderShyamDesigns();
    }

    // --- UTILITIES ---
    function escapeJs(str) {
      return str.replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast("Copied to clipboard! ✨");
      }).catch(() => {
        showToast("Failed to copy");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    // Startup
    window.onload = () => {
      generateFonts();
      renderBios();
      renderCaptions();
      renderHashtags();
    };
  </script>
</body>
</html>
